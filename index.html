<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blog Editor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Georgia, serif; background: #f4f1ec; min-height: 100vh; padding: 30px 20px; }
  h1 { text-align: center; font-size: 1.8rem; color: #2c2c2c; margin-bottom: 6px; }
  .subtitle { text-align: center; color: #888; font-size: 0.85rem; font-family: sans-serif; margin-bottom: 30px; }
  .container { max-width: 860px; margin: 0 auto; }
  .card { background: #fff; border-radius: 12px; padding: 28px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
  label { display: block; font-family: sans-serif; font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: #666; margin-bottom: 8px; }
  input[type="text"], input[type="datetime-local"] { width: 100%; padding: 10px 14px; border: 1.5px solid #e0dbd2; border-radius: 8px; font-size: 1rem; font-family: Georgia, serif; color: #2c2c2c; background: #fdfcfa; outline: none; }
  input:focus { border-color: #b07d4f; }
  .row { display: flex; gap: 12px; align-items: flex-end; margin-top: 16px; }
  .row .field { flex: 1; }
  textarea { width: 100%; min-height: 220px; padding: 14px; border: 1.5px solid #e0dbd2; border-radius: 8px; font-size: 1.05rem; font-family: Georgia, serif; color: #2c2c2c; background: #fdfcfa; line-height: 1.75; resize: vertical; outline: none; }
  textarea:focus { border-color: #b07d4f; }
  .hint { font-family: sans-serif; font-size: 0.78rem; color: #aaa; margin-top: 6px; }
  .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-family: sans-serif; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; }
  .btn-gold { background: #b07d4f; color: #fff; }
  .btn-gold:hover { background: #8f6238; }
  .btn-now { background: #f0ebe2; color: #6b4c2a; height: 40px; align-self: flex-end; }
  .btn-now:hover { background: #e0d5c5; }
  .btn-clear { background: #f4f1ec; color: #888; }
  .tabs { display: flex; gap: 4px; border-bottom: 2px solid #f0ebe2; margin-bottom: 16px; }
  .tab { padding: 8px 18px; border: none; background: none; cursor: pointer; font-family: sans-serif; font-size: 0.88rem; font-weight: 600; color: #aaa; border-bottom: 2px solid transparent; margin-bottom: -2px; }
  .tab.active { color: #b07d4f; border-bottom-color: #b07d4f; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  #preview-box { min-height: 120px; padding: 18px; border: 1.5px solid #e0dbd2; border-radius: 8px; background: #fdfcfa; line-height: 1.8; }
  #preview-box .post-title { font-size: 1.4rem; font-weight: bold; margin-bottom: 6px; }
  #preview-box .post-meta { font-size: 0.82rem; color: #999; font-family: sans-serif; margin-bottom: 16px; }
  #html-output { width: 100%; min-height: 160px; padding: 14px; border: 1.5px solid #e0dbd2; border-radius: 8px; background: #1e1e1e; color: #d4c5a9; font-family: 'Courier New', monospace; font-size: 0.82rem; line-height: 1.6; resize: vertical; outline: none; }
  .copy-row { display: flex; justify-content: flex-end; margin-top: 10px; }
  .btn-copy { background: #2c2c2c; color: #d4c5a9; font-size: 0.82rem; }
  .btn-copy:hover { background: #444; }
  .btn-copy.copied { background: #4a7c59; color: #fff; }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
</style>
</head>
<body>
<div class="container">
  <h1>✍️ Blog Editor</h1>
  <p class="subtitle">Just write — &lt;p&gt; and &lt;br&gt; tags are added automatically</p>

  <div class="card">
    <div><label>Post Title</label><input type="text" id="title" placeholder="Enter your blog post title…"></div>
    <div class="row">
      <div class="field"><label>Date & Time</label><input type="datetime-local" id="datetime"></div>
      <button class="btn btn-now" onclick="setNow()">📅 Now</button>
    </div>
  </div>

  <div class="card">
    <label>Your Content</label>
    <textarea id="content" placeholder="Just type your content here…

Leave a blank line between paragraphs → becomes a &lt;p&gt; tag.
A single line break → becomes a &lt;br&gt; tag.

No need to write any HTML manually!"></textarea>
    <p class="hint">Blank line = new &lt;p&gt; &nbsp;|&nbsp; Single line break = &lt;br&gt;</p>
    <div class="actions">
      <button class="btn btn-gold" onclick="generate()">⚡ Generate HTML</button>
      <button class="btn btn-clear" onclick="clearAll()">Clear</button>
    </div>
  </div>

  <div class="card" id="output-card" style="display:none">
    <div class="tabs">
      <button class="tab active" id="tab-btn-preview" onclick="switchTab('preview',this)">👁 Preview</button>
      <button class="tab" id="tab-btn-html" onclick="switchTab('html',this)">🔖 HTML Code</button>
    </div>
    <div class="tab-content active" id="tab-preview"><div id="preview-box"></div></div>
    <div class="tab-content" id="tab-html">
      <textarea id="html-output" readonly></textarea>
      <div class="copy-row"><button class="btn btn-copy" id="copy-btn" onclick="copyHTML()">📋 Copy HTML</button></div>
    </div>
  </div>
</div>

<script>
  setNow();
  function setNow() {
    const now = new Date(), p = n => String(n).padStart(2,'0');
    document.getElementById('datetime').value = `${now.getFullYear()}-${p(now.getMonth()+1)}-${p(now.getDate())}T${p(now.getHours())}:${p(now.getMinutes())}`;
  }
  function textToHTML(text) {
    return text.split(/\n\s*\n/).map(para => {
      const t = para.trim();
      if (!t) return '';
      return `<p>${t.split('\n').map(l=>l.trim()).join('<br>\n  ')}</p>`;
    }).filter(Boolean).join('\n\n');
  }
  function formatDate(v) {
    if (!v) return '';
    return new Date(v).toLocaleString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});
  }
  function generate() {
    const title = document.getElementById('title').value.trim();
    const content = document.getElementById('content').value.trim();
    const dt = document.getElementById('datetime').value;
    if (!content) { alert('Please write some content first!'); return; }
    const htmlContent = textToHTML(content);
    const dateStr = formatDate(dt);
    let fullHTML = '';
    if (title) fullHTML += `<h2>${title}</h2>\n`;
    if (dateStr) fullHTML += `<p class="post-meta">${dateStr}</p>\n\n`;
    fullHTML += htmlContent;
    let previewHTML = '';
    if (title) previewHTML += `<div class="post-title">${title}</div>`;
    if (dateStr) previewHTML += `<div class="post-meta">${dateStr}</div>`;
    previewHTML += htmlContent;
    document.getElementById('preview-box').innerHTML = previewHTML;
    document.getElementById('html-output').value = fullHTML;
    document.getElementById('output-card').style.display = 'block';
    document.getElementById('output-card').scrollIntoView({behavior:'smooth'});
  }
  function switchTab(name, btn) {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+name).classList.add('active');
  }
  function copyHTML() {
    navigator.clipboard.writeText(document.getElementById('html-output').value).then(()=>{
      const b = document.getElementById('copy-btn');
      b.textContent = '✅ Copied!'; b.classList.add('copied');
      setTimeout(()=>{ b.textContent='📋 Copy HTML'; b.classList.remove('copied'); }, 2000);
    });
  }
  function clearAll() {
    document.getElementById('title').value='';
    document.getElementById('content').value='';
    document.getElementById('output-card').style.display='none';
    setNow();
  }
</script>
</body>
</html>
